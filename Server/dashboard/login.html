<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mimo Pro — Sign in</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(1100px 560px at 22% -12%,#0A84FF26,transparent 60%),
        radial-gradient(900px 480px at 88% 108%,#64D2FF22,transparent 62%),
        #05070D;
      font-family:'Segoe UI',system-ui,sans-serif;color:#F5F7FF;overflow:hidden
    }
    /* AI ambient orbs */
    .orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.30;pointer-events:none;animation:float 16s ease-in-out infinite alternate}
    .orb.a{width:430px;height:430px;background:#0A84FF;top:-140px;left:-130px}
    .orb.b{width:340px;height:340px;background:#64D2FF;bottom:-130px;right:-90px;animation-delay:-8s}
    .orb.c{width:260px;height:260px;background:#0055D4;top:58%;left:8%;animation-delay:-4s;opacity:.18}
    @keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,32px) scale(1.14)}}

    .card{
      position:relative;width:min(420px,92vw);padding:44px 38px 34px;
      background:rgba(14,21,36,.66);backdrop-filter:blur(20px);
      border:1px solid rgba(34,48,80,.9);border-radius:24px;
      box-shadow:0 30px 80px -20px rgba(2,6,18,.9),inset 0 1px 0 rgba(255,255,255,.05);
      animation:rise .55s cubic-bezier(.21,1.02,.73,1) both
    }
    @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

    /* Animated AI gradient border */
    .card::before{
      content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;
      background:conic-gradient(from var(--ang,0deg),#0A84FF66,#64D2FF99,#30D15844,#0A84FF66);
      animation:spinBorder 7s linear infinite;opacity:.65;
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none
    }
    @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
    @keyframes spinBorder{to{--ang:360deg}}

    /* Brand mark — matches the app icon */
    .logo{
      width:64px;height:64px;margin:0 auto 20px;border-radius:19px;display:grid;place-items:center;
      background:linear-gradient(135deg,#7DD3FC,#0A84FF 55%,#0055D4);
      box-shadow:0 12px 30px -8px #0A84FFcc,inset 0 1px 0 #ffffff55;
      font-size:28px;font-weight:800;color:#fff;letter-spacing:.01em;
      animation:pulse 4.5s ease-in-out infinite
    }
    .logo::after{content:'';position:absolute;width:64px;height:64px;border-radius:19px;border:1px solid #ffffff33;pointer-events:none;margin-top:-84px}
    @keyframes pulse{0%,100%{box-shadow:0 12px 30px -8px #0A84FFcc}50%{box-shadow:0 14px 44px -6px #0A84FFee}}
    h1{margin:0;text-align:center;font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
    .sub{margin:8px 0 28px;text-align:center;color:#8A96B8;font-size:.86rem}

    .field{position:relative;margin-bottom:14px}
    input[type=password]{
      width:100%;padding:15px 48px 15px 16px;border-radius:14px;
      background:#0A1220;border:1.5px solid #223050;color:#F5F7FF;
      font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s,background .2s
    }
    input[type=password]::placeholder{color:#5C6885}
    input[type=password]:focus{border-color:#0A84FF;box-shadow:0 0 0 4px #0A84FF2b;background:#0D1628}
    .eye{
      position:absolute;right:8px;top:50%;transform:translateY(-50%);
      border:0;background:none;color:#5C6885;cursor:pointer;padding:8px;border-radius:8px;
      display:grid;place-items:center;transition:color .2s
    }
    .eye:hover{color:#64D2FF}

    button.signin{
      width:100%;padding:14px;margin-top:8px;border:0;border-radius:14px;cursor:pointer;
      font-size:.98rem;font-weight:800;color:#fff;letter-spacing:.01em;
      background:linear-gradient(135deg,#38BDF8,#0A84FF 55%,#0060DF);
      background-size:170% 170%;transition:background-position .35s,transform .12s,box-shadow .25s;
      box-shadow:0 12px 30px -10px #0A84FFbb
    }
    button.signin:hover{background-position:100% 50%;transform:translateY(-1px);box-shadow:0 14px 38px -10px #0A84FFdd}
    button.signin:active{transform:translateY(0)}
    button.signin:disabled{filter:saturate(.5);cursor:wait}

    .msg{min-height:20px;margin:14px 0 0;text-align:center;font-size:.82rem;color:#FF6961;transition:opacity .2s}
    .msg.ok{color:#30D158}
    .spinner{
      display:inline-block;width:13px;height:13px;margin-right:6px;vertical-align:-2px;
      border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .shake{animation:shake .38s}
    @keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

    .lock{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;color:#5C6885;font-size:.74rem}
    .lock svg{opacity:.7}
    @media(max-height:600px){body{overflow:auto;padding:30px 0}}
  </style>
</head>
<body>
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

  <form id="loginForm" class="card" autocomplete="on">
    <div class="logo">M</div>
    <h1>Mimo Pro</h1>
    <p class="sub">Sign in to control your connected devices</p>

    <div class="field">
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required autofocus>
      <button type="button" class="eye" id="toggle" aria-label="Show password">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="signin" type="submit" id="btn">Sign in</button>
    <p class="msg" id="loginError" role="alert"></p>

    <div class="lock">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secured connection · 3 attempts before lockout
    </div>
  </form>

<script>
const form=document.getElementById('loginForm'),input=document.getElementById('password'),
      btn=document.getElementById('btn'),err=document.getElementById('loginError');

document.getElementById('toggle').onclick=()=>{input.type=input.type==='password'?'text':'password'};

form.addEventListener('submit',async e=>{
  e.preventDefault();
  err.className='msg';err.innerHTML='<span class="spinner"></span>Signing in…';btn.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){err.className='msg ok';err.textContent='✓ Access granted';setTimeout(()=>location.replace('/'),350);return}
    const m=d.attemptsLeft==null?(d.error||'Login failed'):`${d.error} · ${d.attemptsLeft} attempt${d.attemptsLeft===1?'':'s'} left`;
    err.textContent=m;form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake');
  }catch(x){err.textContent='Network error — check the server and try again'}
  btn.disabled=false;
});
</script>
</body>
</html>

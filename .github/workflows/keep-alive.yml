name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://windows-remote-toolkit-k2nn.onrender.com/api/health)
          echo "Health check returned: $code"
